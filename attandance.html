<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Attandance Record</title>
    <link rel="stylesheet" href="attandance.css">
</head>
<body>
    <div class="panel">
        <div class="heading">
            <h2>Student ERP</h2>
            <i class="fa-solid fa-bars"></i>
        </div>
        <a href="dashboard.html" class="link"><i class="fa-regular fa-house"></i>Dashboard</a>
        <a href="profile.html" class="link"><i class="fa-regular fa-circle-user"></i>Profile</a>
        <a href="attandance.html" class="link"><i class="fa-regular fa-calendar-days"></i>Attandane Record</a>
        <a href="punch.html" class="link"><i class="fa-regular fa-clock"></i>Daily Punch Record</a>
        <a href="#" class="link"><i class="fa-solid fa-book-open"></i>Courses</a>
        <a href="#" class="link"><i class="fa-regular fa-calendar"></i>Time Table</a>
        <a href="#" class="link"><i class="fa-solid fa-chart-simple"></i>Results</a>
        <a href="#" class="link"><i class="fa-solid fa-wallet"></i>Fees</a>
        <a href="#" class="link"><i class="fa-regular fa-bell"></i>Notices</a>
        <a href="#" class="link"><i class="fa-solid fa-gear"></i></i>Setting</a>
    </div>
    <div class="container">
        <div class="navbar">
            <h1>Attandance Record</h1>
        </div>
        <div class="info">
            <div class="overall">
                <h2>Overall Attandance</h2>
                <p>85%</p>
            </div>
            <div class="total">
                <h2>Total Days</h2>
                <p>100</p>
            </div>
            <div class="present">
                <h2>Present Days</h2>
                <p>85</p>
            </div>
            <div class="absent">
                <h2>Absent Days</h2>
                <p>15</p>
            </div>
        </div>
    </div>

    <script src="attandance.js"></script>
</body>
</html>
